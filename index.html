<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e18" />
    <title>Harness · AI Expert</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">H</span><strong>Harness</strong></div>
        <span class="repo" id="projectName">Demo local</span>
        <div class="actions">
          <label class="engine-control">Motor
            <select id="engineSelect"><option value="mock">Mock</option><option value="pi">Pi</option></select>
          </label>
          <button class="button button-quiet" id="resetButton">Reiniciar</button>
          <button class="button button-outline" id="pauseButton" disabled>⏸ Pausar</button>
          <button class="button button-primary" id="waveButton">▶ Iniciar oleada</button>
        </div>
      </header>

      <details class="project-picker">
        <summary>Seleccionar proyecto <span id="engineStatus"></span></summary>
        <form id="projectForm">
          <input id="projectPath" name="path" autocomplete="off" placeholder="/ruta/absoluta/al/proyecto" />
          <button class="button button-outline" type="submit">Cargar</button>
          <button class="button button-quiet" type="button" id="demoButton">Volver a la demo</button>
        </form>
        <p id="projectMessage">Sólo se inspeccionan feature_list.json y .harness/config.json de la ruta seleccionada.</p>
      </details>

      <section class="workspace-heading">
        <div>
          <p class="eyebrow" id="contextLabel">WAVE-042 · DEMO LOCAL</p>
          <h1>Ejecución de tareas</h1>
          <p class="run-status" id="runLabel">Oleada preparada</p>
        </div>
        <div class="summary" aria-label="Resumen de la oleada">
          <span><strong id="activeCount">0</strong> activas</span>
          <span><strong id="reviewCount">0</strong> en revisión</span>
          <span class="blocked-summary"><strong id="blockerCount">0</strong> bloqueada</span>
        </div>
      </section>

      <section class="progress" aria-live="polite">
        <div class="progress-track"><span id="progressBar"></span></div>
        <div class="progress-meta"><span id="progressText"></span><span id="timerText">Se detiene antes del merge</span></div>
      </section>

      <section class="board-wrap">
        <div class="empty-state" id="emptyState" hidden></div>
        <div class="board" id="board" aria-label="Tablero Kanban de tareas"></div>
      </section>

      <article class="evidence-panel">
        <header class="evidence-heading">
          <div><p class="eyebrow">EVIDENCIA</p><h2 id="detailTitle"></h2></div>
          <span class="state-pill" id="detailState"></span>
        </header>
        <div id="detailContent"></div>
      </article>
    </main>

    <template id="taskTemplate">
      <article class="task-card" tabindex="0">
        <div class="card-top"><span class="issue"></span><span class="card-alert"></span></div>
        <h3></h3>
        <div class="skill-row"><span>Skill</span><b class="skill"></b></div>
        <div class="gate-row"><span class="gate-icon">✓</span><span class="gate"></span></div>
        <footer><span class="owner"></span><span class="card-controls"><button class="card-action" type="button">Ejecutar</button><span class="avatar"></span></span></footer>
      </article>
    </template>
    <script src="app.js"></script>
  </body>
</html>
